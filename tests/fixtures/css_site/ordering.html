<!doctype html>
<html>
<head>
  <title>External stylesheet ordering</title>
  <style>
    /* Inline author sheet before the linked sheet. */
    #first { color: #ff0000; }
    #third { color: #ff0000; }
  </style>
  <link rel="stylesheet" href="styles/ordering.css">
  <style>
    /* Inline author sheet after the linked sheet. */
    #second { color: #0000ff; }
    #third { color: #0000ff; }
  </style>
</head>
<body>
  <p id="first">First</p>
  <p id="second">Second</p>
  <p id="third">Third</p>
</body>
</html>
