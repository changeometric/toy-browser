name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.compiler }} build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
          - compiler: clang
            cc: clang
            cxx: clang++
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install approved build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake make g++ clang \
            libx11-dev libpng-dev libfreetype-dev libharfbuzz-dev \
            libfontconfig1-dev libssl-dev

      - name: Configure
        run: >
          cmake -S . -B build
          -DTOYBROWSER_BUILD_TESTS=ON
          -DTOYBROWSER_WERROR=ON

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Run the test suite
        run: ctest --test-dir build --output-on-failure -j"$(nproc)"

      - name: Install smoke test
        run: |
          cmake --install build --prefix "${RUNNER_TEMP}/toybrowser"
          test -x "${RUNNER_TEMP}/toybrowser/bin/toybrowser"
          test -f "${RUNNER_TEMP}/toybrowser/share/doc/toybrowser/README.md"
